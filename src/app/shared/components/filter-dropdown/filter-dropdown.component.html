<div class="dropdown" *transloco="let t">
	<button
		type="button"
		class="btn btn-sm dropdown-toggle"
		[class.btn-outline-secondary]="!selected().length"
		[class.btn-secondary]="!!selected().length"
		data-bs-toggle="dropdown"
		data-bs-auto-close="outside"
		aria-expanded="false"
	>
		{{ t(label()) }}
		@if (selected().length) {
			<span class="badge rounded-pill text-bg-light ms-1">{{ selected().length }}</span>
		}
	</button>
	<ul class="dropdown-menu dropdown-menu-end p-2">
		@for (option of options(); track option) {
			<li>
				<label class="dropdown-item d-flex align-items-center gap-2 mb-0">
					<input
						class="form-check-input mt-0"
						type="checkbox"
						[checked]="isOn(option)"
						(change)="filterToggle.emit({ value: option, checked: $any($event.target).checked })"
					/>
					{{ t(optionLabelPrefix() + option) }}
				</label>
			</li>
		}
	</ul>
</div>
