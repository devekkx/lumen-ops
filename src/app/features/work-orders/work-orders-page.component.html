<section *transloco="let t">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<div>
			<h1>{{ t('order.title') }}</h1>
			<p class="text-secondary mb-0">{{ t('order.subtitle') }}</p>
		</div>
		<div class="d-flex gap-2 lum-toolbar">
			<button type="button" class="btn btn-sm btn-outline-secondary" (click)="refresh()">
				{{ t('table.refresh') }}
			</button>
			@if (abilities().exportData) {
				<button type="button" class="btn btn-sm btn-outline-secondary" data-action="export" (click)="exportCsv()">
					{{ t('table.exportCsv') }}
				</button>
			}
		</div>
	</div>

	<div class="card card-body mb-3">
		<div class="d-flex flex-wrap align-items-center gap-2 lum-toolbar">
			<label class="d-block w-md">
				<span class="form-label lum-visually-hidden">{{ t('table.search') }}</span>
				<input
					class="form-control form-control-sm"
					type="search"
					[placeholder]="t('table.searchOrders')"
					(input)="setSearch($any($event.target).value)"
				/>
			</label>

			<div class="ms-auto">
				<lumen-filter-dropdown
					label="order.status"
					optionLabelPrefix="status."
					[options]="statuses"
					[selected]="statusFilter"
					(filterToggle)="toggleStatus($event)"
				/>
			</div>
		</div>
	</div>

	<lumen-table
		[caption]="'order.title'"
		[columns]="columns()"
		[pillColumns]="pillColumns"
		[dateColumns]="dateColumns"
		[page]="displayPage$ | async"
		[loading]="(loading | async) ?? false"
		[error]="error | async"
		[sortProperty]="sortProperty"
		[sortDirection]="sortDirection"
		(sort)="sortBy($event)"
		(pageChange)="setPage($event)"
		(perPageChange)="setPerPage($event)"
		(retry)="refresh()"
	>
		@if (hasRowActions()) {
		<ng-template #rowActions let-order>
			<div class="d-flex flex-wrap gap-1">
				@if (canAssign(order)) {
					<button
						type="button"
						class="btn btn-sm btn-link p-1"
						data-action="assign"
						data-bs-toggle="tooltip"
						[title]="t('order.assign')"
						[attr.aria-label]="t('order.assign')"
						(click)="assignCrew(order)"
					>
						<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<circle cx="12" cy="8" r="3.5" />
							<path d="M4.5 20c.7-3.9 3.8-6.5 7.5-6.5s6.8 2.6 7.5 6.5" />
						</svg>
					</button>
				}
				@if (canStart(order)) {
					<button
						type="button"
						class="btn btn-sm btn-link p-1"
						data-action="start"
						data-bs-toggle="tooltip"
						[title]="t('order.start')"
						[attr.aria-label]="t('order.start')"
						(click)="startOrder(order)"
					>
						<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M7 4.5v15l12-7.5-12-7.5Z" />
						</svg>
					</button>
				}
				@if (canComplete(order)) {
					<button
						type="button"
						class="btn btn-sm btn-link p-1"
						data-action="complete"
						data-bs-toggle="tooltip"
						[title]="t('order.complete')"
						[attr.aria-label]="t('order.complete')"
						(click)="completeOrder(order)"
					>
						<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<circle cx="12" cy="12" r="10" />
							<path d="m8 12 3 3 5-6" />
						</svg>
					</button>
				}
			</div>
		</ng-template>
		}
	</lumen-table>
</section>
