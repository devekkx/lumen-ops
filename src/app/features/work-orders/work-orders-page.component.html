<section *transloco="let t">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<div>
			<p class="text-uppercase text-secondary small mb-1">{{ t('nav.orders') }}</p>
			<h1>{{ t('order.title') }}</h1>
			<p class="text-secondary mb-0">{{ t('order.subtitle') }}</p>
		</div>
		<button type="button" class="lum-btn lum-btn--secondary" (click)="refresh()">
			{{ t('table.retry') }}
		</button>
	</div>

	<div class="lum-panel mb-3">
		<label class="lum-field mb-3">
			<span class="lum-field__label">{{ t('table.search') }}</span>
			<input
				class="lum-field__control lum-field__control--sm"
				type="search"
				[placeholder]="t('table.searchOrders')"
				(input)="setSearch($any($event.target).value)"
			/>
		</label>

		<div>
			<span class="lum-field__label d-block mb-2">{{ t('order.status') }}</span>
			<div class="d-flex flex-wrap gap-2">
				@for (status of statuses; track status) {
					<button
						type="button"
						class="lum-chip"
						[class.lum-chip--on]="isStatusOn(status)"
						[attr.aria-pressed]="isStatusOn(status)"
						(click)="toggleStatus(status, !isStatusOn(status))"
					>
						{{ t('status.' + status) }}
					</button>
				}
			</div>
		</div>
	</div>

	<lumen-table
		[caption]="'order.title'"
		[columns]="columns"
		[pillColumns]="pillColumns"
		[page]="displayPage$ | async"
		[loading]="(loading | async) ?? false"
		[error]="error | async"
		[sortProperty]="sortProperty"
		[sortDirection]="sortDirection"
		(sort)="sortBy($event)"
		(pageChange)="setPage($event)"
		(perPageChange)="setPerPage($event)"
		(retry)="refresh()"
	>
		@if (hasRowActions()) {
		<ng-template #rowActions let-order>
			<div class="d-flex flex-wrap gap-2">
				@if (canAssign(order)) {
					<button
						type="button"
						class="lum-btn lum-btn--tertiary lum-btn--sm"
						data-action="assign"
						(click)="assignCrew(order)"
					>
						{{ t('order.assign') }}
					</button>
				}
				@if (canStart(order)) {
					<button
						type="button"
						class="lum-btn lum-btn--tertiary lum-btn--sm"
						data-action="start"
						(click)="startOrder(order)"
					>
						{{ t('order.start') }}
					</button>
				}
				@if (canComplete(order)) {
					<button
						type="button"
						class="lum-btn lum-btn--tertiary lum-btn--sm"
						data-action="complete"
						(click)="completeOrder(order)"
					>
						{{ t('order.complete') }}
					</button>
				}
			</div>
		</ng-template>
		}
	</lumen-table>
</section>
