<section *transloco="let t">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<div>
			<h1>{{ t('lum.title') }}</h1>
		</div>
		<button type="button" class="btn btn-outline-secondary" (click)="refresh()">
			{{ t('table.refresh') }}
		</button>
	</div>

	<div class="card card-body mb-3">
		<label class="d-block mb-3">
			<span class="form-label">{{ t('table.search') }}</span>
			<input
				class="form-control form-control-sm"
				type="search"
				[placeholder]="t('table.searchPlaceholder')"
				(input)="setSearch($any($event.target).value)"
			/>
		</label>

		<div class="mb-3">
			<span class="form-label d-block mb-2">{{ t('lum.status') }}</span>
			<div class="d-flex flex-wrap gap-2">
				@for (status of statuses; track status) {
					<button
						type="button"
						class="lum-chip"
						[class.lum-chip--on]="isStatusOn(status)"
						[attr.aria-pressed]="isStatusOn(status)"
						(click)="toggleStatus(status, !isStatusOn(status))"
					>
						{{ t('status.' + status) }}
					</button>
				}
			</div>
		</div>

		<div>
			<span class="form-label d-block mb-2">{{ t('lum.lampType') }}</span>
			<div class="d-flex flex-wrap gap-2">
				@for (lampType of lampTypes; track lampType) {
					<button
						type="button"
						class="lum-chip"
						[class.lum-chip--on]="isLampTypeOn(lampType)"
						[attr.aria-pressed]="isLampTypeOn(lampType)"
						(click)="toggleLampType(lampType, !isLampTypeOn(lampType))"
					>
						{{ t('lamp.' + lampType) }}
					</button>
				}
			</div>
		</div>
	</div>

	<details class="card card-body mb-3">
		<summary>{{ t('table.dsl') }}</summary>
		@if (dslLines().length) {
			<pre class="mb-0 mt-2">{{ dslLines().join('\n') }}</pre>
		} @else {
			<p class="text-secondary small mb-0 mt-2">{{ t('table.dslEmpty') }}</p>
		}
	</details>

	<lumen-table
		[caption]="'lum.title'"
		[columns]="columns"
		[pillColumns]="pillColumns"
		[dateColumns]="dateColumns"
		[page]="page$ | async"
		[loading]="(loading | async) ?? false"
		[error]="error | async"
		[sortProperty]="sortProperty"
		[sortDirection]="sortDirection"
		(sort)="sortBy($event)"
		(pageChange)="setPage($event)"
		(perPageChange)="setPerPage($event)"
		(retry)="refresh()"
	/>
</section>
