<section *transloco="let t">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<div>
			<h1>{{ t('lum.title') }}</h1>
		</div>
		<button type="button" class="btn btn-outline-secondary" (click)="refresh()">
			{{ t('table.refresh') }}
		</button>
	</div>

	<div class="card card-body mb-3">
		<div class="d-flex flex-wrap align-items-end gap-2">
			<label class="d-block w-md">
				<span class="form-label">{{ t('table.search') }}</span>
				<input
					class="form-control form-control-sm"
					type="search"
					[placeholder]="t('table.searchPlaceholder')"
					(input)="setSearch($any($event.target).value)"
				/>
			</label>

			<div class="d-flex flex-wrap gap-2 ms-auto">
				<lumen-filter-dropdown
					label="lum.status"
					optionLabelPrefix="status."
					[options]="statuses"
					[selected]="statusFilter"
					(filterToggle)="toggleStatus($event)"
				/>
				<lumen-filter-dropdown
					label="lum.lampType"
					optionLabelPrefix="lamp."
					[options]="lampTypes"
					[selected]="lampTypeFilter"
					(filterToggle)="toggleLampType($event)"
				/>
			</div>
		</div>
	</div>

	<details class="card card-body mb-3">
		<summary>{{ t('table.dsl') }}</summary>
		@if (dslLines().length) {
			<pre class="mb-0 mt-2">{{ dslLines().join('\n') }}</pre>
		} @else {
			<p class="text-secondary small mb-0 mt-2">{{ t('table.dslEmpty') }}</p>
		}
	</details>

	<lumen-table
		[caption]="'lum.title'"
		[columns]="columns"
		[pillColumns]="pillColumns"
		[dateColumns]="dateColumns"
		[page]="page$ | async"
		[loading]="(loading | async) ?? false"
		[error]="error | async"
		[sortProperty]="sortProperty"
		[sortDirection]="sortDirection"
		(sort)="sortBy($event)"
		(pageChange)="setPage($event)"
		(perPageChange)="setPerPage($event)"
		(retry)="refresh()"
	/>
</section>
