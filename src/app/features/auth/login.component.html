<div class="login" *transloco="let t">
	<div class="login__inner">
		<div class="login__langs" role="group" [attr.aria-label]="t('shell.language')">
			@for (locale of locales; track locale) {
				<button
					class="login__lang"
					type="button"
					[class.login__lang--on]="activeLocale() === locale"
					[attr.aria-pressed]="activeLocale() === locale"
					(click)="use(locale)"
				>
					{{ locale.toUpperCase() }}
				</button>
			}
		</div>

		<div class="login__head">
			<span class="login__wordmark">lumen ops</span>
			<h1 class="login__title">{{ t('auth.title') }}</h1>
			<p class="login__subtitle">{{ t('auth.subtitle') }}</p>
		</div>

		<div class="login__panel">
			<form class="login__form" (ngSubmit)="submit()">
				<label class="d-block" for="login-email">
					<span class="form-label">{{ t('auth.user') }}</span>
					<input
						class="form-control"
						id="login-email"
						type="email"
						name="email"
						autocomplete="username"
						[placeholder]="t('auth.userPlaceholder')"
						[ngModel]="email()"
						(ngModelChange)="email.set($event)"
					/>
				</label>

				<label class="d-block" for="login-password">
					<span class="form-label">{{ t('auth.password') }}</span>
					<input
						class="form-control"
						id="login-password"
						type="password"
						name="password"
						autocomplete="current-password"
						[placeholder]="t('auth.passwordPlaceholder')"
						[ngModel]="password()"
						(ngModelChange)="password.set($event)"
					/>
				</label>

				@if (error()) {
					<p class="login__error" role="alert">{{ error() }}</p>
				} @else if (bootFailure()) {
					<p class="login__error" role="alert">{{ t(bootFailure()!) }}</p>
				}

				<label class="login__switch">
					<input
						type="checkbox"
						name="expired"
						[ngModel]="expired()"
						(ngModelChange)="expired.set($event)"
					/>
					<span>{{ t('auth.expiredSwitch') }}</span>
				</label>

				<button class="btn btn-primary w-100" type="submit" [disabled]="busy()">
					{{ busy() ? t('auth.signingIn') : t('auth.signIn') }}
				</button>
			</form>
		</div>
	</div>
</div>
