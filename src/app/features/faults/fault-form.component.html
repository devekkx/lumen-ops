<section *transloco="let t">
	<p class="text-uppercase text-secondary small mb-1">{{ t('nav.faults') }}</p>
	<h1 class="mb-4">{{ t(mode() === 'edit' ? 'fault.edit' : 'fault.new') }}</h1>

	@if (loading()) {
		<p class="text-secondary">{{ t('common.loading') }}</p>
	} @else {
		<form class="card card-body" [formGroup]="form" (ngSubmit)="save()">
			<label class="d-block mb-3">
				<span class="form-label">{{ t('fault.picker') }}</span>
				<lumen-luminaire-picker formControlName="luminaireId" />
				@if (fieldError('luminaireId'); as err) {
					<!-- The picker owns its own <input>, so there is no control here for
					     Bootstrap's .is-invalid ~ .invalid-feedback sibling rule to key
					     off; force it visible instead of relying on that. -->
					<span class="invalid-feedback d-block">{{ t(err.key, err.params) }}</span>
				}
			</label>

			<label class="d-block mb-3">
				<span class="form-label">{{ t('fault.severity') }}</span>
				<select
					class="form-select"
					[class.is-invalid]="fieldError('severity')"
					formControlName="severity"
				>
					@for (severity of severities; track severity) {
						<option [value]="severity">{{ t('severity.' + severity) }}</option>
					}
				</select>
				@if (fieldError('severity'); as err) {
					<span class="invalid-feedback">{{ t(err.key, err.params) }}</span>
				}
			</label>

			<label class="d-block mb-3">
				<span class="form-label">{{ t('fault.description') }}</span>
				<textarea
					class="form-control"
					[class.is-invalid]="fieldError('description')"
					rows="3"
					formControlName="description"
					[placeholder]="t('fault.descriptionPlaceholder')"
				></textarea>
				@if (fieldError('description'); as err) {
					<span class="invalid-feedback">{{ t(err.key, err.params) }}</span>
				}
			</label>

			<div class="d-flex gap-3 mb-3">
				<label class="d-block flex-fill">
					<span class="form-label">{{ t('fault.reportedAt') }}</span>
					<input
						class="form-control"
						[class.is-invalid]="fieldError('reportedAt')"
						type="date"
						formControlName="reportedAt"
					/>
					@if (fieldError('reportedAt'); as err) {
						<span class="invalid-feedback">{{ t(err.key, err.params) }}</span>
					}
				</label>

				<label class="d-block flex-fill">
					<span class="form-label">{{ t('fault.dueAt') }}</span>
					<input
						class="form-control"
						[class.is-invalid]="fieldError('dueAt')"
						type="date"
						formControlName="dueAt"
					/>
					@if (fieldError('dueAt'); as err) {
						<span class="invalid-feedback">{{ t(err.key, err.params) }}</span>
					}
				</label>
			</div>

			<div class="d-flex justify-content-end gap-2">
				<button type="button" class="btn btn-outline-secondary" (click)="cancel()">
					{{ t('fault.cancel') }}
				</button>
				<button type="submit" class="btn btn-primary" [disabled]="saving()">
					{{ t('fault.save') }}
				</button>
			</div>
		</form>
	}
</section>
