<section *transloco="let t">
	<div class="d-flex justify-content-between align-items-center mb-4">
		<div>
			<h1>{{ t('crew.title') }}</h1>
			<p class="text-secondary mb-0">{{ t('crew.subtitle') }}</p>
		</div>
		<button type="button" class="btn btn-outline-secondary" (click)="refresh()">
			{{ t('table.refresh') }}
		</button>
	</div>

	<div class="card card-body mb-3">
		<label class="d-block mb-0">
			<span class="form-label">{{ t('table.search') }}</span>
			<input
				class="form-control form-control-sm"
				type="search"
				[placeholder]="t('table.searchCrews')"
				(input)="setSearch($any($event.target).value)"
			/>
		</label>
	</div>

	<lumen-table
		[caption]="'crew.title'"
		[columns]="columns"
		[pillColumns]="pillColumns"
		[page]="page$ | async"
		[loading]="(loading | async) ?? false"
		[error]="error | async"
		[sortProperty]="sortProperty"
		[sortDirection]="sortDirection"
		(sort)="sortBy($event)"
		(pageChange)="setPage($event)"
		(perPageChange)="setPerPage($event)"
		(retry)="refresh()"
	>
		@if (hasRowActions()) {
		<ng-template #rowActions let-crew>
			<button
				type="button"
				class="btn btn-sm btn-link p-1"
				data-action="edit"
				data-bs-toggle="tooltip"
				[title]="t('crew.edit')"
				[attr.aria-label]="t('crew.edit')"
				(click)="editCrew(crew)"
			>
				<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3Z" />
				</svg>
			</button>
		</ng-template>
		}
	</lumen-table>
</section>
