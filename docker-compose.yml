# `docker compose up --build` from a clean clone: builds the Angular app and
# the mock API from the same Dockerfile (via `target:`) and wires them
# together the way `npm run dev` does locally — except here nginx, not the
# Angular dev-server proxy (src/proxy.conf.json), is what forwards /api to
# the mock API, since a production image has no dev server to carry that
# proxy config. See the Dockerfile and deploy/nginx.conf for the rest of that
# story.
services:
  mock-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: mock-api
    environment:
      PORT: '3000'
    expose:
      - '3000'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - '8080:80'
    depends_on:
      - mock-api
    restart: unless-stopped
