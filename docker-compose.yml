services:
  mock-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: mock-api
    environment:
      PORT: "3000"
    expose:
      - "3000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8080:80"
    depends_on:
      - mock-api
    restart: unless-stopped
