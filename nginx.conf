# Serves the built Angular app and proxies /api to the mock-api container.
#
# The app uses withHashLocation() (app.config.ts), so every in-app route lives
# after a `#` and never reaches the server at all - a bare static file server
# would already be enough for routing. The `try_files` fallback below is kept
# anyway as ordinary defensive practice (a direct hit missing a hashed asset
# still resolves to index.html rather than a raw 404 page), not because this
# app needs SPA history-mode rewriting.
#
# `mock-api` below is a hostname, not a literal - it resolves via Docker's
# embedded DNS to the `mock-api` service in docker-compose.yml, on the
# network compose creates automatically for the project. This image is not
# meant to be run standalone against a real backend; see the Dockerfile and
# docker-compose.yml comments for what a real deployment would change here.

server {
	# 8080, not 80: cgr.dev/chainguard/nginx runs as a non-root user, which
	# cannot bind a port below 1024 - 8080 is that image's own documented
	# default for exactly this reason.
	listen 8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Baseline security headers. CSP is scoped to what this app actually
	# loads: Bootstrap's JS and this app's own bundles are same-origin
	# (Angular CLI copies them into dist, nothing is CDN-loaded); Google
	# Fonts (index.html's <link>s) and OpenLayers' default OSM tile source
	# (ol/source/OSM.js - tile.openstreetmap.org) are the only external
	# hosts anything on this page reaches. style-src needs 'unsafe-inline'
	# because the app binds many inline `style` attributes directly
	# (e.g. the sidebar toggle's floating position) - rewriting all of
	# those to CSS classes just to drop one directive isn't worth the
	# churn; script-src stays strict since nothing here needs inline JS.
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

	location /api/ {
		proxy_pass http://mock-api:3000/api/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
		try_files $uri =404;
		expires 30d;
		add_header Cache-Control "public, max-age=2592000, immutable";
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
